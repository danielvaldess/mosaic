<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FieldSight — Installed Base Intelligence</title>
<style>
  :root {
    --viewbox: #11161a;      /* unlit viewbox — neutral, not near-black */
    --film: #1a2229;         /* film sheet surface */
    --film-hi: #202a33;
    --hairline: #2a3641;     /* 1px slice lines */
    --text: #e7edf1;
    --muted: #94a3ad;
    --signal: #58c4dd;       /* live / current — PACS cursor cyan */
    --amber: #e0a63c;        /* aging / refresh flag — film amber */
    --ok: #5fc98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--viewbox);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  /* -- Header: engraved nameplate + scanner readout band -- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 500; letter-spacing: 0.5px; }
  .wordmark small { display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 1.5px; font-weight: 400; }
  .readout { font-size: 12px; color: var(--muted); text-align: right; }
  .readout b { color: var(--signal); font-weight: 500; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 32px 60px; }

  /* -- Band of global readouts: one row, like a gantry status line -- */
  .band {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    background: var(--hairline);
    border: 1px solid var(--hairline);
    margin: 18px 0 34px;
  }
  .band > div { background: var(--viewbox); padding: 14px 16px; }
  .band b { display: block; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .band span { font-size: 12px; color: var(--muted); }
  .band .amber b { color: var(--amber); }

  /* -- Each customer is a film sheet / axial slice row -- */
  .sheet {
    background: var(--film);
    border: 1px solid var(--hairline);
    margin-bottom: 14px;
    padding: 16px 18px;
  }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .sheet h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 500; }
  .sheet .loc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .flag { font-size: 12px; color: var(--amber); border: 1px solid var(--amber); padding: 1px 9px; letter-spacing: 0.6px; }
  .flag.ok { color: var(--ok); border-color: var(--ok); }

  /* -- Modality traces -- */
  .traces { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .trace { display: grid; grid-template-columns: 120px 1fr 110px; align-items: center; gap: 14px; font-size: 13px; }
  .trace .name { color: var(--text); }
  .trace .bar { position: relative; height: 14px; background: #11161a; border: 1px solid var(--hairline); }
  .trace .bar i { position: absolute; inset: 0 auto 0 0; background: var(--signal); opacity: 0.85; }
  .trace .bar i.warn { background: var(--amber); }
  .trace .meta { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .trace .meta b { color: var(--text); font-weight: 500; }
  .trace .meta .flag-dot { color: var(--amber); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  .legend .l-signal { background: var(--signal); }
  .legend .l-amber { background: var(--amber); }

  @media (max-width: 640px) {
    header { flex-direction: column; }
    .readout { text-align: left; }
    .trace { grid-template-columns: 1fr; gap: 4px; }
    .trace .meta { text-align: left; }
  }
</style>
</head>
<body>
<header>
  <h1 class="wordmark">FieldSight<small>Installed Base Intelligence · on-device</small></h1>
  <div class="readout" id="readout">scanning…</div>
</header>
<main>
  <section class="band" id="band"></section>
  <section id="sheets"></section>
  <div class="legend">
    <span><i class="l-signal"></i>current observation</span>
    <span><i class="l-amber"></i>aging equipment (≥7y)</span>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s)
async function load() {
  const [stats, customers] = await Promise.all([
    fetch('/api/stats').then(r => r.json()),
    fetch('/api/customers').then(r => r.json()),
  ])
  const agedPct = stats.totalUnits ? Math.round(stats.refreshCandidates.reduce((s,c)=>s+c.totalUnits,0)/stats.totalUnits*100) : 0
  $('#readout').innerHTML = `${stats.totalCustomers} sites · ${stats.totalObservations} observations · <b>${stats.totalUnits}</b> units · ${stats.staleCount} stale`
  $('#band').innerHTML = `
    <div><b>${stats.totalCustomers}</b><span>sites</span></div>
    <div><b>${stats.totalObservations}</b><span>observations</span></div>
    <div><b>${stats.totalUnits}</b><span>units</span></div>
    <div><b>${Object.entries(stats.byCountry).length}</b><span>countries</span></div>
    <div class="amber"><b>${stats.refreshCandidates.length}</b><span>refresh flags</span></div>
    <div><b>${stats.staleCount}</b><span>stale sites</span></div>`

  const maxUnits = Math.max(1, ...customers.map(c => c.totalUnits))
  $('#sheets').innerHTML = customers.map(c => {
    const flag = c.refreshOpportunity
      ? '<span class="flag">refresh</span>'
      : (c.staleDays > 180 ? '<span class="flag">stale</span>' : '<span class="flag ok">current</span>')
    const traces = c.equipment.map(e => {
      const aging = (e.avgAge ?? 0) >= 7
      const w = Math.max(4, Math.round(e.totalQuantity / maxUnits * 100))
      return `<div class="trace">
        <span class="name">${e.modality}</span>
        <span class="bar"><i class="${aging ? 'warn' : ''}" style="width:${w}%"></i></span>
        <span class="meta"><b>${e.totalQuantity}</b>${e.avgAge !== undefined ? ` · ${e.avgAge.toFixed(0)}y${aging ? ' <span class="flag-dot">▲</span>' : ''}` : ' · age —'}</span>
      </div>`
    }).join('')
    return `<article class="sheet">
      <div class="sheet-head">
        <div><h2>${c.customer.name}</h2><div class="loc">${c.customer.city}, ${c.customer.country} · ${c.observationCount} observations</div></div>
        ${flag}
      </div>
      <div class="traces">${traces}</div>
    </article>`
  }).join('')
}
load()
</script>
</body>
</html>
