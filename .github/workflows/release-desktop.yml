name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional code signing (set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD repo secrets)
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Fetch bundled AI model (offline installer)
        run: npm run model:fetch
      - name: Build installer
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm run desktop:dist
      - name: Create draft release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --clobber release/Mosaic-Setup.exe release/latest.yml
          } else {
            gh release create $tag --draft --title $tag --generate-notes release/Mosaic-Setup.exe release/latest.yml
          }
